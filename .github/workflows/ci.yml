name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: extractions/setup-just@v2
      - run: npm ci --ignore-scripts
      - run: just lint
      - run: just test
      - run: just build
